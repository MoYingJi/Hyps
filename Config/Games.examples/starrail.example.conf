#!/hint/bash
#shellcheck disable=2034

# === dwproton 11.0-10 及以上版本才能运行 === #



# 选用的运行器, 在 `../Runners/$RUNNER.conf` 中定义
RUNNER="umu-run"
# 选择的前缀, 不填写则由运行器选择
#PREFIX="/path/to/prefix"

# 游戏本体路径
GAME="/path/to/Star Rail Game/StarRail.exe"



# 注册表解锁帧率 (修改 GraphicsSettings_Model 中的 FPS)
# 原理同 Windows 端三月七小助手，每次启动前修改 user.reg
#STARRAIL_REG_FPS="y"
# 目标帧率, 默认为 120
STARRAIL_REG_FPS_VAL="120"
# 修改注册表用的脚本
#STARRAIL_REG_FPS_SCRIPT="/path/to/Tools/starrail-fps.py"



# 监测游戏窗口
XWIN_WATCH_WINDOW="崩坏：星穹铁道"

# 是否在游戏启动时修改 Hosts 断网
#NETWORK_HOSTS="y"
# 断网 Hosts 内容
NETWORK_HOSTS_CONTENT="0.0.0.0 globaldp-prod-cn01.bhsr.com"
