game.exe = "/path/to/Endfield Game/Endfield.exe"

# 需要 dwproton 11.0-14 及以上版本
runner.name = "umu-dwproton"

# 推荐 NVIDIA 显卡驱动 615.78.08 及以上版本
# 如遇 DLSS 帧生成卡死问题，尝试更换 Proton 和显卡驱动版本，已知 dwproton & 615.71.09 会导致问题
# 驱动版本在 615.71.09 (不包含) 以下时，NVIDIA Reflex 需要额外配置 VK_LAYER_DXVK_NVAPI_reflex 层

# 父进程检查
# 1.6 版本起，游戏要求从官方启动器打开，否则会报错「请通过官方启动器打开游戏」
# TL;DR:
#endfield.surrogate.mode = "hardlink-or-copy"
#env.GAMEID = "umu-endfield"
#
# 此脚本提供了两种模式解决此问题，无需依赖官方启动器的父进程替身，和更干净的官方启动器挂起
#
# 方式一: 替身父进程模式
# 把游戏 exe 硬链接或复制为 <游戏目录>/../gryph-surrogate/Games.exe，再挂起它作为游戏的父进程
# 不需要安装官方启动器
# 使用此模式时必须设置 endfield.surrogate.mode
#   # 构建方式:
#   #   hardlink          硬链接，失败不回退
#   #   copy              复制
#   #   hardlink-or-copy  优先硬链接，跨文件系统时回退为复制
#   endfield.surrogate.mode = "hardlink-or-copy"
#   # 可选: 替身目标目录，默认为 <游戏目录>/../gryph-surrogate (为了提高硬链接成功率)
#   endfield.surrogate.dir = "/path/to/your/surrogate-dir"
#   # 可选：替身源文件，默认为游戏 exe 自身
#   endfield.surrogate = "/path/to/Endfield Game/Endfield.exe"
#   # 可选：游戏退出后保留替身文件和新建的目录，默认删除；不能与 endfield.launcher 一起使用
#   endfield.surrogate.keep = true
#
# 方式二: 挂起官方启动器作为父进程
#   # 可以填启动器目录，会自动查找版本号最高的 Games.exe；也可以直接填 exe 的完整路径
#   endfield.launcher = "/path/to/Hypergryph Launcher"
#   endfield.launcher = "/path/to/Hypergryph Launcher/1.6.0/Games.exe"
#   # 配置了 endfield.launcher 后，方式一的相关配置会被忽略
#
# 因为没有直接启动游戏本体，所以需要设置
#   env.GAMEID = "umu-endfield"

# 游戏参数
game.args = [
    # "-force-d3d11", # 如果需要 D3D11 启动游戏，可以取消其注释
    # "-force-vulkan", # 默认是 Vulkan，通常不需要强制指定
]
