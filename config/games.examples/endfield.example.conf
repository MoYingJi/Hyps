game.exe = "/path/to/Endfield Game/Endfield.exe"

# 需要 dwproton 11.0-14 及以上版本
runner.name = "umu-dwproton"

# 推荐 NVIDIA 显卡驱动 615.78.08 及以上版本
# 如遇 DLSS 帧生成卡死问题，尝试更换 Proton 和显卡驱动版本，已知 dwproton & 615.71.09 会导致问题
# 驱动版本在 615.71.09 (不包含) 以下时，NVIDIA Reflex 需要额外配置 VK_LAYER_DXVK_NVAPI_reflex 层

# 父进程检查
# 1.6 版本起，游戏要求从官方启动器打开，否则会报错「请通过官方启动器打开游戏」
# TL;DR:
#endfield.surrogate.mode = "hardlink-or-copy"
#game.umu_id = "umu-endfield"
#
# 此脚本提供了两种模式解决此问题，无需依赖官方启动器的父进程替身，和更干净的官方启动器挂起
#
# 方式一: 替身父进程模式
# 把游戏 exe 硬链接或复制为 <游戏目录>/../gryph-surrogate/Games.exe，再挂起它作为游戏的父进程
# 不需要安装官方启动器
# 使用此模式时必须设置 endfield.surrogate.mode
#   # 构建方式:
#   #   hardlink          硬链接，失败不回退
#   #   copy              复制
#   #   hardlink-or-copy  优先硬链接，跨文件系统时回退为复制
#   endfield.surrogate.mode = "hardlink-or-copy"
#   # 可选: 替身目标位置
#   #   硬链接默认为 <游戏目录>/../gryph-surrogate/Games.exe (为了提高硬链接成功率)
#   #   复制默认为 <临时目录>/Games.exe (默认 /tmp/hypsc)
#   #   支持 endfield.surrogate.{,hardlink_,copy_}{dir,target} 设置项
#   #   无前缀: 硬链接和复制共用; hardlink_ / copy_: 只作用于对应方式，优先于无前缀
#   #   dir: 目录，文件名固定为 Games.exe; target: 完整文件路径，指定自定义文件名
#   #   同一前缀下 dir 与 target 只能二选一
#   endfield.surrogate.dir = "/path/to/your/surrogate-dir"
#   # 可选: 替身源文件，默认为游戏 exe 自身
#   endfield.surrogate.launcher = "/path/to/Endfield Game/Endfield.exe"
#   # 可选: 游戏退出后保留替身文件和新建的目录，默认删除
#   endfield.surrogate.keep = true
#
# 方式二: 挂起官方启动器作为父进程
#   endfield.surrogate.mode = "launcher"
#   # 可以填启动器目录，会自动查找版本号最高的 Games.exe；也可以直接填 exe 的完整路径
#   endfield.surrogate.launcher = "/path/to/Hypergryph Launcher"
#   endfield.surrogate.launcher = "/path/to/Hypergryph Launcher/1.6.0/Games.exe"
#
# 两种方式的通用配置
#   # 可选: 游戏启动后等待 N 秒结束挂起的父进程并退出，游戏继续运行
#   endfield.surrogate.exit_after = 20
#   # 可选: 通过信息框显示工具的 info 日志
#   endfield.surrogate.show_info = true
#
# 替身程序 / 启动器启动时，用 game.umu_id 标记实际游戏，以匹配 ProtonFixes

# 游戏参数
game.args = [
    # "-force-d3d11", # 如果需要 D3D11 启动游戏，可以取消其注释
    # "-force-vulkan", # 默认是 Vulkan，通常不需要强制指定
]
