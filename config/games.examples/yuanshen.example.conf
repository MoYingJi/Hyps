game.exe = "/path/to/Genshin Impact Game/YuanShen.exe"

# 需要 dwproton 11.0-2 及以上版本
runner.name = "umu-dwproton"

# 应该会自动检测到 如果游戏打不开就来开
#env.GAMEID = "umu-genshin"

# 帧率解锁
# 警告: 游戏会定期向服务器报告测得的帧率，使用此工具风险自负
# 可使用以下命令热更新帧率限制 (将 120 替换为你想要的帧率)
# `echo 120 > /tmp/hypsc/fpsunlock_fifo`
# 反作弊严格的场景（幽境危战、千星奇域）可能会报错「检测到非法工具」10612-4001
# 游戏前关闭帧率解锁，或热更新帧率限制到 60
#gi.fps_unlock.enabled = true
#gi.fps_unlock.val = 165
#gi.fps_unlock.sleep = 10 # 如果不设置就是调用 xwin-watch，需要设置窗口名称
#features.xwin_watch.window_name = "原神"

# 注册表 HDR
#gi.reg_hdr.enabled = true
# 注意还要确保本机和 proton 的 HDR 可用
#env.PROTON_ENABLE_WAYLAND = true
#env.PROTON_ENAbLE_HDR = true
#env.DXVK_HDR = true
